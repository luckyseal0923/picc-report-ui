<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>PICC 待施打清單</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", Arial, sans-serif;
      background: #f6f7f9;
      margin: 0;
      padding: 20px;
    }

    h2 {
      margin: 0 0 12px;
    }

    .hint {
      font-size: 13px;
      color: #555;
      margin-bottom: 12px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .left {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .meta {
      font-size: 14px;
      color: #666;
    }

    .claimed {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #c0392b;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      background: #2563eb;
      color: #fff;
      white-space: nowrap;
    }

    .empty {
      color: #777;
      padding: 12px 4px;
    }

    .error {
      color: #c0392b;
      padding: 12px 4px;
      font-weight: 700;
    }
  </style>
</head>

<body>

<h2>📋 PICC 待施打清單</h2>
<div class="hint">
  僅顯示「已接單（待施打）」案件；點擊後進入施打回報頁。
</div>

<div id="msg"></div>
<div id="list"></div>

<script>
/* =========================
   API 設定
========================= */
const API_LIST =
  "https://chihwei-n8n.zeabur.app/webhook/picc/pending-list";

/* =========================
   工具
========================= */
function $(id) {
  return document.getElementById(id);
}

function safe(v) {
  return v === null || v === undefined ? "" : String(v);
}

function setMsg(type, text) {
  const el = $("msg");
  el.className = type || "";
  el.textContent = text || "";
}

/* =========================
   載入清單（完整版）
========================= */
async function loadList() {
  setMsg("", "");
  $("list").innerHTML = "";

  try {
    console.log("[loadList] API_LIST =", API_LIST);

    const res = await fetch(API_LIST, { cache: "no-store" });
    console.log("[loadList] HTTP status =", res.status);

    // 先抓原始文字
    const raw = await res.text();
    console.log("[loadList] raw response =", raw);

    if (!res.ok) throw new Error("HTTP " + res.status);

    /* =========================
       ⭐ 關鍵修正點 ⭐
       n8n 在「0 筆資料」時
       可能回傳空字串 ""
    ========================= */
    if (!raw || raw.trim() === "") {
      setMsg("empty", "📭 目前沒有任何預約施打案件");
      return;
    }

    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      throw new Error("回傳不是 JSON：" + raw.slice(0, 200));
    }
    
    /* =========================
       情境 1：完全沒有任何預約（[]）
    ========================= */
    if (data.length === 0) {
      setMsg("empty", "📭 目前沒有任何預約施打案件");
      return;
    }

    /* =========================
       情境 2：有預約，但尚未有人接單
       （只顯示：待施打 + 已接單）
    ========================= */
    const rows = data.filter(r =>
      safe(r.status) === "待施打" && safe(r.claimedBy)
    );

    if (rows.length === 0) {
      setMsg("empty", "📭 目前沒有已接單的待施打案件");
      return;
    }

    /* =========================
       情境 3：正常顯示清單
    ========================= */
rows.forEach(item => {
  $("list").appendChild(renderCard(item));
});

  } catch (err) {
    console.error("[loadList] error =", err);
    setMsg("error", "❌ 無法載入待施打清單，請稍後再試或重新整理");
  }
}
/* =========================
   單筆卡片
========================= */
function renderCard(item) {
  const card = document.createElement("div");
  card.className = "card";

  const taskId    = safe(item.taskId);
  const name      = safe(item.name);
  const bedNo     = safe(item.bedNo);
  const mrn       = safe(item.mrn);
  const createdDateOnly = formatDateOnly(item.createdAt);
  const claimedBy = safe(item.claimedBy);
  
  // ⭐ 就放在這裡 ⭐
const hasDifficultHistory =
  item.hasDifficultHistory === 1 ||
  item.hasDifficultHistory === true;

  
  // ✅ waiting time（現在時間 - 起單時間）
  const waitingTime = calcWaitingTime(item.createdAt);

  card.innerHTML = `
  <div class="left">

    <!-- 第 1 列：姓名 + 困難 icon -->
    <div class="name">
      ${name || "（未填姓名）"}
      ${
        hasDifficultHistory
          ? `<span
               title="曾有困難 / 非常困難 PICC 放置紀錄"
               style="
                 margin-left:6px;
                 color:#d97706;
                 font-size:16px;
                 cursor:help;
               "
             >⚠️曾困難放置紀錄</span>`
          : ""
      }
    </div>

    <!-- 第 2 列：床號 + 病歷號 -->
    <div class="meta">
      床號 ${bedNo} ｜ 病歷號 ${mrn}
    </div>

    <!-- 第 3 列：起單時間 -->
    <div class="meta">
      起單時間 ${createdDateOnly}
    </div>

    <!-- 第 4 列：接單者 -->
    <div class="claimed">
      👤 接單者：${claimedBy}
    </div>

    <!-- 第 5 列：等候時間 -->
    ${
      waitingTime
        ? `<div class="waiting">⏱ ${waitingTime}</div>`
        : ""
    }

  </div>

  <div>
    <button class="btn"
      onclick="goReport('${taskId}', '${claimedBy}')">
      回報完成
    </button>
  </div>
`;


  return card;
}


/* =========================
   前往回報頁
========================= */
function goReport(taskId, operator) {
  if (!taskId) {
    alert("缺少 taskId，無法進入回報頁");
    return;
  }

  const url =
    "https://luckyseal0923.github.io/picc-report-ui/report.html"
    + "?taskId=" + encodeURIComponent(taskId)
    + "&operator=" + encodeURIComponent(operator || "");

  window.location.href = url;
}

/* =========================
   啟動
========================= */
loadList();
/* =========================
   計算 Waiting Time
   現在時間 - 起單時間
   顯示：日 + 時
========================= */
function calcWaitingTime(orderTime) {
  if (!orderTime) return "";

  // ✅ 強制正規化時間字串
  // 例：2026-01-26 01 : 05 → 2026-01-26T01:05
  const normalized = orderTime
    .replace(/\s+/g, " ")   // 多餘空白壓成一個
    .replace(" ", "T")      // 日期與時間中間
    .replace(" : ", ":");   // 修正 01 : 05

  const start = new Date(normalized);
  const now = new Date();

  if (isNaN(start.getTime())) return "";

  const diffMs = now.getTime() - start.getTime();
  if (diffMs <= 0) return "等待 0 小時";

  const totalHours = Math.floor(diffMs / (1000 * 60 * 60));
  const days = Math.floor(totalHours / 24);
  const hours = totalHours % 24;

  if (days > 0 && hours > 0) {
    return `等待 ${days} 天 ${hours} 小時`;
  }
  if (days > 0) {
    return `等待 ${days} 天`;
  }
  return `等待 ${hours} 小時`;
}

/* =========================
   顯示用：只顯示日期（台灣時間）
========================= */
function formatDateOnly(dateStr) {
  if (!dateStr) return "";

  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;

  return d.toLocaleDateString("zh-TW", {
    timeZone: "Asia/Taipei",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  });
}
</script>
<!-- 一鍵公告按鈕 -->
<button
  id="announceBtn"
  style="
    padding: 12px 20px;
    font-size: 16px;
    background-color: #0A84FF;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  "
>
  📣 一鍵發布「待施打清單」
</button>

<script>
  document.getElementById("announceBtn").addEventListener("click", async () => {
    const webhookUrl = "https://chihwei-n8n.zeabur.app/webhook/picc/announce/pending";

    if (!confirm("確定要發布「待施打清單」公告到 LINE 群組嗎？")) {
      return;
    }

    try {
      const res = await fetch(webhookUrl, {
        method: "GET"
      });

      if (!res.ok) {
        throw new Error("Webhook 呼叫失敗");
      }

      alert("✅ 已送出公告請求，請查看 LINE 群組");
    } catch (err) {
      console.error(err);
      alert("❌ 公告失敗，請查看主控台或 n8n");
    }
  });
</script>
  
</body>
</html>
