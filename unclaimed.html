<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>PICC 待預約清單</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Noto Sans TC", Arial, sans-serif;
  background: #fff7ed;
  margin: 0;
  padding: 20px;
}

h2 {
  margin-bottom: 8px;
  color: #92400e;
}

.hint {
  font-size: 14px;
  color: #7c2d12;
  margin-bottom: 16px;
}

.card {
  background: #ffffff;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
  border-left: 6px solid #f59e0b;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.card-inner {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.name {
  font-size: 18px;
  font-weight: 700;
}

.meta {
  font-size: 14px;
  color: #444;
  line-height: 1.5;
  word-break: break-all; /* ✅ 不截斷病歷號 */
}

.taskid {
  margin-top: 4px;
  font-size: 12px;
  color: #9ca3af;
}

.action {
  display: flex;
  gap: 10px;
}

select {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  font-size: 14px;
}

.btn {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 15px;
  background: #f59e0b;
  color: #fff;
  font-weight: 700;
  white-space: nowrap;
}

.btn:disabled {
  background: #d1d5db;
  cursor: not-allowed;
}

.empty {
  color: #92400e;
  font-size: 15px;
  margin-top: 20px;
}

.error {
  color: #b91c1c;
  font-weight: 700;
  margin-top: 20px;
}
</style>
</head>

<body>

<h2>⚠️ PICC 待預約清單</h2>
<div class="hint">
以下案件尚未被接單，請選擇施打人後點選「預約施打」。
</div>

<div id="msg"></div>
<div id="list"></div>

<script>
const API_LIST = "https://chihwei-n8n.zeabur.app/webhook/unclaimed-list";
const API_BOOK = "https://chihwei-n8n.zeabur.app/webhook/unclaimed-list/booking";

const OPERATORS = [
  { id: "gong_bairong", name: "龔柏榕" },
  { id: "chang_chihwei", name: "張智維" },
  { id: "chen_weichi", name: "陳瑋琪" },
  { id: "chuang_dongen", name: "莊東恩" },
  { id: "chen_boan", name: "陳柏安" }
];

const $ = id => document.getElementById(id);
const safe = v => v ?? "";

function setMsg(type, text) {
  const el = $("msg");
  el.className = type || "";
  el.textContent = text || "";
}

async function loadList() {
  $("list").innerHTML = "";
  setMsg("", "");

  try {
    const res = await fetch(API_LIST, { cache: "no-store" });

    // ⛔ HTTP 本身就失敗（例如 500、404）
    if (!res.ok) {
      throw new Error("HTTP error");
    }

    const data = await res.json();

    // ⛔ API 回傳格式不正確（不是陣列）
    if (!Array.isArray(data)) {
      throw new Error("Invalid data format");
    }

    // ⭐ 只篩選「待預約」
    const rows = data.filter(r => r.status === "待預約");

    // ✅ 沒有待預約案件（正常狀況）
    if (rows.length === 0) {
      setMsg("empty", "📭 目前沒有待預約施打之對象");
      return;
    }

    // ✅ 有資料才 render
    rows.forEach(item => {
      $("list").appendChild(renderCard(item, data));
    });

  } catch (e) {
    console.error(e);
    setMsg("error", "❌ 無法載入待預約清單");
  }
}

function renderCard(item, allRows) {
  const card = document.createElement("div");
const hasDifficultHistory = item.hasDifficultHistory;

  card.className = "card";

  const select = document.createElement("select");

  // ✅ placeholder
  const placeholder = document.createElement("option");
  placeholder.textContent = "請選擇施打人";
  placeholder.disabled = true;
  placeholder.selected = true;
  select.appendChild(placeholder);

  OPERATORS.forEach(op => {
    const opt = document.createElement("option");
    opt.value = op.id;
    opt.textContent = op.name;
    select.appendChild(opt);
  });

  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = "預約施打";

  btn.onclick = async () => {
    if (select.selectedIndex === 0) {
      alert("請先選擇施打人");
      return;
    }

    const operator = OPERATORS[select.selectedIndex - 1];
    btn.disabled = true;
    btn.textContent = "處理中…";

    try {
      const res = await fetch(API_BOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          taskId: item.taskId,
          operatorId: operator.id,
          operatorName: operator.name
        })
      });

      if (!res.ok) throw new Error();
      card.remove();
    } catch {
      alert("❌ 預約失敗，請稍後再試");
      btn.disabled = false;
      btn.textContent = "預約施打";
    }
  };

card.innerHTML = `
  <div class="card-inner">
    <div>
      <div class="name">${safe(item.name)}</div>

      ${
        hasDifficultHistory
          ? `<div style="color:#b91c1c;font-weight:700;margin-top:4px;">
              ⚠️ 曾有困難放置紀錄
            </div>`
          : ``
      }

      <div class="meta">
        床號 ${safe(item.bedNo)} ｜ 病歷號 ${safe(item.mrn)}
      </div>
      <div class="taskid">任務編號：${safe(item.taskId)}</div>
    </div>
    <div class="action"></div>
  </div>
`;


  card.querySelector(".action").append(select, btn);
  return card;
}

loadList();
</script>

</body>
</html>
