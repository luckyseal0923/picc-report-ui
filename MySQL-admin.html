<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICC 後臺管理系統</title>

<style>
:root {
  --primary: #10B981;
  --primary-dark: #059669;
  --bg: #f1f5f9;
  --text: #334155;
  --border: #e2e8f0;
  --navy: #1e3a8a;
}

* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  margin-bottom: 20px;
  gap: 16px;
}

.header-title-wrap {
  background: #ffffff;
  border: 1px solid #cbd5e1;
  border-left: 6px solid var(--navy);
  border-radius: 10px;
  padding: 14px 18px;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
  min-width: 320px;
}

.header-kicker {
  font-size: 12px;
  font-weight: 700;
  color: #475569;
  letter-spacing: 0.8px;
  margin-bottom: 6px;
}

.header-title {
  margin: 0;
  font-size: 26px;
  line-height: 1.2;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: 0.2px;
}

.header-subtitle {
  margin-top: 6px;
  font-size: 13px;
  color: #64748b;
  font-weight: 500;
}

.filter-bar {
  background: white;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-wrap: wrap;
}

.filter-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.filter-field label {
  font-size: 12px;
  font-weight: 700;
  color: #475569;
}

.filter-field input {
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
  font-size: 14px;
  color: #0f172a;
}

.filter-field-date input {
  width: 150px;
}

.filter-field-keyword input {
  width: 220px;
}

.chart-card,
.table-container,
.pager {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
}

.table-container {
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
}

.pager {
  box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04);
}

.chart-card {
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
  border: 1px solid #cbd5e1;
}

.chart-card {
  padding: 20px;
  margin-top: 28px;
  margin-bottom: 16px;
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid #e2e8f0;
}

.chart-title {
  font-size: 18px;
  font-weight: 800;
  color: #0f172a;
  margin: 0;
}

.chart-subtitle {
  font-size: 13px;
  color: #64748b;
  margin-top: 4px;
}

.chart-meta {
  font-size: 13px;
  color: #475569;
  font-weight: 600;
}

.bar-chart {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 14px;
  min-height: 260px;
  overflow-x: auto;
  padding: 10px 4px 0;
}

.chart-threshold {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 2px dashed #f59e0b;
  pointer-events: none;
}

.chart-threshold-label {
  position: absolute;
  right: 0;
  top: -12px;
  font-size: 12px;
  font-weight: 700;
  color: #b45309;
  background: rgba(255, 255, 255, 0.95);
  padding: 0 6px;
}

.bar-item {
  min-width: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.bar-value {
  font-size: 12px;
  color: #334155;
  font-weight: 700;
}

.bar-track {
  width: 100%;
  height: 180px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.bar {
  width: 36px;
  background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
  border-radius: 10px 10px 0 0;
  min-height: 8px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,0.08);
}

.bar-label {
  font-size: 12px;
  color: #64748b;
  font-weight: 600;
  text-align: center;
  line-height: 1.4;
}

.chart-empty {
  padding: 28px 12px;
  text-align: center;
  color: #64748b;
  font-size: 14px;
}

.list-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.list-meta {
  font-size: 13px;
  color: #64748b;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

th {
  background: #e2e8f0;
  padding: 14px;
  font-size: 13px;
  text-align: left;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}

td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  vertical-align: middle;
  word-break: break-word;
}

.status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.status-booking { background: #e0f2fe; color: #0369a1; }
.status-pending { background: #fef3c7; color: #92400e; }
.status-done { background: #dcfce7; color: #166534; }

.view-mode { display: inline; }
.edit-mode { display: none; width: 95%; }
.editing .view-mode { display: none; }
.editing .edit-mode { display: inline; }

.btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.btn-edit { background: #f1f5f9; }
.btn-save { background: var(--primary); color: white; display: none; }
.btn-del { background: #fee2e2; color: #b91c1c; }
.editing .btn-save { display: inline-block; }
.editing .btn-edit { display: none; }

.pager {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 14px;
  padding: 10px 12px;
  background: #f8fafc;
  border: 1px solid #dbe4ee;
}

.pager-left,
.pager-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.select-sm {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
  font-size: 13px;
}

.page-info {
  font-size: 13px;
  color: #475569;
}

.btn-page {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: white;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.btn-page:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.page-numbers {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.page-number,
.page-ellipsis {
  min-width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 13px;
}

.page-number {
  border: 1px solid var(--border);
  background: white;
  cursor: pointer;
  font-weight: 600;
}

.page-number.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.page-ellipsis {
  color: #64748b;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.modal-backdrop.show {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.18);
}

.modal-title {
  font-size: 18px;
  font-weight: 800;
  color: #0f172a;
  margin-bottom: 8px;
}

.modal-desc {
  font-size: 13px;
  color: #64748b;
  margin-bottom: 16px;
  line-height: 1.6;
}

.modal-grid {
  display: grid;
  gap: 12px;
}

.modal-field {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.modal-field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #334155;
  margin-bottom: 6px;
}

.modal-field input {
  width: 160px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}

@media (max-width: 1000px) {
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  tr {
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 15px;
    padding: 10px;
    background: white;
  }
  td {
    display: flex;
    justify-content: space-between;
    padding: 10px 5px;
    border: none;
    border-bottom: 1px dashed #eee;
    text-align: right;
    gap: 12px;
  }
  td::before {
    content: attr(data-label);
    font-weight: bold;
    color: #64748b;
    text-align: left;
    flex: 0 0 110px;
  }
  td:last-child { border: none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title-wrap">
    <div class="header-kicker">臺北市立萬芳醫院｜PICC 後臺管理模組</div>
    <h2 class="header-title">PICC 後臺管理系統</h2>
    <div class="header-subtitle">院內 PICC 任務管理與案件追蹤</div>
  </div>

  <div class="filter-bar">
    <div class="filter-field filter-field-date">
      <label for="dateStart">開始日期</label>
      <input type="date" id="dateStart">
    </div>
    <div class="filter-field filter-field-date">
      <label for="dateEnd">結束日期</label>
      <input type="date" id="dateEnd">
    </div>
    <div class="filter-field filter-field-keyword">
      <label for="keywordInput">關鍵字搜尋</label>
      <input type="text" id="keywordInput" placeholder="請輸入關鍵字" oninput="filterKeyword()">
    </div>
    <button class="btn" style="background:var(--primary); color:white; height:40px;" onclick="loadTasks(true)">查詢區間</button>
    <button class="btn" style="background:#0f172a; color:white; height:40px;" onclick="openCsvModal()">下載 CSV</button>
  </div>
</div>

<div class="list-toolbar">
  <div class="toolbar-actions">
    <div class="list-meta" id="listMeta">共 0 筆案件</div>
  </div>
  <div class="pager-left">
    <label for="pageSizeSelect" style="font-size:13px; color:#475569;">每頁顯示</label>
    <select id="pageSizeSelect" class="select-sm" onchange="changePageSize()">
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="30" selected>30</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <span style="font-size:13px; color:#475569;">筆</span>
  </div>
</div>

<div class="table-container">
  <table id="taskTable">
    <colgroup>
      <col style="width: 15%;">
      <col style="width: 10%;">
      <col style="width: 12%;">
      <col style="width: 8%;">
      <col style="width: 9%;">
      <col style="width: 9%;">
      <col style="width: 11%;">
      <col style="width: 10%;">
      <col style="width: 7%;">
      <col style="width: 13%;">
      <col style="width: 10%;">
    </colgroup>
    <thead>
      <tr>
        <th>起單時間 / 任務編號</th>
        <th>病人姓名</th>
        <th>床號 / 病歷號</th>
        <th>Status</th>
        <th>接單者</th>
        <th>施打者</th>
        <th>管路資訊</th>
        <th>部位 / 血管</th>
        <th>困難度</th>
        <th>備註</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="taskBody"></tbody>
  </table>
</div>

<div class="pager">
  <div class="pager-left">
    <span class="page-info" id="pageInfo">第 1 / 1 頁</span>
  </div>
  <div class="pager-right">
    <button class="btn-page" id="prevPageBtn" onclick="goToPage(currentPage - 1)">上一頁</button>
    <div class="page-numbers" id="pageNumbers"></div>
    <button class="btn-page" id="nextPageBtn" onclick="goToPage(currentPage + 1)">下一頁</button>
  </div>
</div>

<div class="chart-card">
  <div class="chart-header">
    <div>
      <h3 class="chart-title">逐月 PICC 起單案件數</h3>
      <div class="chart-subtitle">統計所有起單案件數，依起單月份彙整</div>
    </div>
    <div class="chart-meta" id="chartMeta">共 0 個月份</div>
  </div>
  <div class="bar-chart" id="monthlyChart"></div>
</div>

<div class="modal-backdrop" id="csvModal">
  <div class="modal-card">
    <div class="modal-title">下載 CSV</div>
    <div class="modal-desc">請設定要下載的案件查詢期間。留白可下載目前畫面已載入的案件資料。</div>
    <div class="modal-grid">
      <div class="modal-field">
        <label for="csvDateStart">開始日期</label>
        <input type="date" id="csvDateStart">
      </div>
      <div class="modal-field">
        <label for="csvDateEnd">結束日期</label>
        <input type="date" id="csvDateEnd">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" style="background:#e2e8f0; color:#334155" onclick="closeCsvModal()">取消</button>
      <button class="btn" style="background:#0f172a; color:white" onclick="confirmDownloadCSV()">下載</button>
    </div>
  </div>
</div>

<script>
const API_LIST = "https://chihwei-n8n.zeabur.app/webhook/admin/tasks";
const API_UPDATE = "https://chihwei-n8n.zeabur.app/webhook/update-task";
const API_DELETE = "https://chihwei-n8n.zeabur.app/webhook/delete-task";

let allRows = [];
let filteredRows = [];
let currentPage = 1;
let pageSize = 30;

function safe(v) {
  return v === undefined || v === null || v === "" ? "-" : v;
}

function renderStatus(status) {
  if (!status || status === "-") return "-";
  if (status === "待預約") return '<span class="status status-booking">待預約</span>';
  if (status === "待施打") return '<span class="status status-pending">待施打</span>';
  if (status === "完成") return '<span class="status status-done">完成</span>';
  return safe(status);
}

function formatDateLocal(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function formatDisplayDateTime(value) {
  if (!value) return "-";
  return String(value).substring(0, 16).replace("T", " ").replace(/-/g, "/");
}

function escapeHTML(value) {
  const str = value === undefined || value === null ? "" : String(value);
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function escapeCSV(value) {
  const str = value === undefined || value === null ? "" : String(value);
  return `"${str.replace(/"/g, '""')}"`;
}

function getMonthKey(value) {
  if (!value) return "";
  const text = String(value);
  const match = text.match(/^(\d{4})[-/](\d{2})/);
  if (!match) return "";
  return `${match[1]}/${match[2]}`;
}

function getMonthlyEntries(rows) {
  const monthMap = {};
  rows.forEach(row => {
    const key = getMonthKey(row.createdAt);
    if (!key) return;
    monthMap[key] = (monthMap[key] || 0) + 1;
  });
  return Object.entries(monthMap).sort((a, b) => a[0].localeCompare(b[0]));
}

function renderPageNumbers(totalPages) {
  if (totalPages <= 1) return "";

  const pages = [];
  if (totalPages <= 7) {
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else {
    pages.push(1);
    if (currentPage <= 4) {
      pages.push(2, 3, 4, 5, "...", totalPages);
    } else if (currentPage >= totalPages - 3) {
      pages.push("...", totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages);
    } else {
      pages.push("...", currentPage - 1, currentPage, currentPage + 1, "...", totalPages);
    }
  }

  return pages.map(p => {
    if (p === "...") return '<span class="page-ellipsis">...</span>';
    return `<button class="page-number ${p === currentPage ? "active" : ""}" onclick="goToPage(${p})">${p}</button>`;
  }).join("");
}

function renderPageNumbersForTest(totalPages, page) {
  const oldCurrentPage = currentPage;
  currentPage = page;
  const html = renderPageNumbers(totalPages);
  currentPage = oldCurrentPage;
  const holder = document.createElement("div");
  holder.innerHTML = html;
  return Array.from(holder.childNodes).map(node => node.textContent.trim()).filter(Boolean).join(",");
}

function runSelfTests() {
  console.assert(formatDateLocal(new Date(2026, 2, 1)) === "2026-03-01", "formatDateLocal 測試失敗");
  console.assert(formatDisplayDateTime("2026-03-17T13:21:00") === "2026/03/17 13:21", "formatDisplayDateTime 測試失敗");
  console.assert(escapeCSV('a"b') === '"a""b"', "escapeCSV 測試失敗");
  console.assert(renderPageNumbersForTest(10, 1) === "1,2,3,4,5,...,10", "頁碼測試 1 失敗");
  console.assert(renderPageNumbersForTest(10, 8) === "1,...,6,7,8,9,10", "頁碼測試 2 失敗");
  console.assert(getMonthKey("2026-03-17T13:21:00") === "2026/03", "月份解析測試失敗");
  console.assert(getMonthlyEntries([
    { createdAt: "2026-03-01T08:00:00" },
    { createdAt: "2026-03-15T08:00:00" },
    { createdAt: "2026-04-01T08:00:00" }
  ]).map(([k, v]) => `${k}:${v}`).join(",") === "2026/03:2,2026/04:1", "逐月統計測試失敗");
}

function renderMonthlyChart(rows) {
  const chartEl = document.getElementById("monthlyChart");
  const chartMeta = document.getElementById("chartMeta");
  const entries = getMonthlyEntries(rows);
  const threshold = 20;

  chartMeta.textContent = `共 ${entries.length} 個月份`;

  if (!entries.length) {
    chartEl.innerHTML = '<div class="chart-empty">目前沒有可呈現的逐月案件資料</div>';
    return;
  }

  const maxValue = Math.max(...entries.map(([, count]) => count), threshold, 1);
  const thresholdHeight = Math.max(8, Math.round((threshold / maxValue) * 180));

  const thresholdHtml = `
    <div class="chart-threshold" style="bottom:${thresholdHeight}px;">
      <span class="chart-threshold-label">20</span>
    </div>
  `;

  const barsHtml = entries.map(([month, count]) => {
    const height = Math.max(8, Math.round((count / maxValue) * 180));
    return `
      <div class="bar-item">
        <div class="bar-value">${count}</div>
        <div class="bar-track">
          <div class="bar" style="height:${height}px;" title="${month}：${count} 筆"></div>
        </div>
        <div class="bar-label">${month}</div>
      </div>
    `;
  }).join("");

  chartEl.innerHTML = thresholdHtml + barsHtml;
}

function renderTable() {
  renderMonthlyChart(allRows);

  const taskBody = document.getElementById("taskBody");
  const listMeta = document.getElementById("listMeta");
  const pageInfo = document.getElementById("pageInfo");
  const prevPageBtn = document.getElementById("prevPageBtn");
  const nextPageBtn = document.getElementById("nextPageBtn");
  const pageNumbers = document.getElementById("pageNumbers");

  const total = filteredRows.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  currentPage = Math.min(Math.max(currentPage, 1), totalPages);

  const startIndex = (currentPage - 1) * pageSize;
  const endIndex = startIndex + pageSize;
  const pageRows = filteredRows.slice(startIndex, endIndex);

  listMeta.textContent = `共 ${total} 筆案件`;
  pageInfo.textContent = `第 ${currentPage} / ${totalPages} 頁`;
  prevPageBtn.disabled = currentPage === 1;
  nextPageBtn.disabled = currentPage === totalPages;
  pageNumbers.innerHTML = renderPageNumbers(totalPages);

  if (!pageRows.length) {
    taskBody.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:24px; color:#64748b;">目前沒有符合條件的案件</td></tr>';
    return;
  }

  taskBody.innerHTML = pageRows.map(row => {
    const taskId = escapeHTML(row.task_id || "");
    const patientName = escapeHTML(safe(row.patient_name));
    const bedNo = escapeHTML(safe(row.bed_no));
    const mrn = escapeHTML(safe(row.MRN));
    const claimedBy = escapeHTML(safe(row.claimedBy));
    const operator = escapeHTML(safe(row.operator));
    const catheterType = escapeHTML(safe(row.catheterType));
    const catheterLength = escapeHTML(safe(row.catheterLength));
    const insertionSite = escapeHTML(safe(row.insertionSite));
    const vein = escapeHTML(safe(row.vein));
    const difficulty = escapeHTML(safe(row.difficulty));
    const remark = escapeHTML(safe(row.remark));
    const createdAt = escapeHTML(formatDisplayDateTime(row.createdAt));
    const statusHtml = renderStatus(row.status);

    return `
<tr id="tr-${taskId}">
  <td data-label="起單時間 / 任務編號">
    <div style="font-size:16px; font-weight:800; color:#0f172a; line-height:1.4;">${createdAt}</div>
    <div style="margin-top:4px; font-size:12px; color:#64748b; font-weight:600;">${taskId}</div>
  </td>
  <td data-label="病人姓名"><b style="font-size:16px; font-weight:800; color:#0f172a;">${patientName}</b></td>
  <td data-label="床號 / 病歷號">
    <span class="view-mode">床號：${bedNo}<br>病歷號：${mrn}</span>
    <div class="edit-mode">
      <input class="bed_no" value="${bedNo}" placeholder="床號">
      <div style="margin-top:6px; font-size:13px; color:#64748b;">病歷號：${mrn}</div>
    </div>
  </td>
  <td data-label="Status">
    <span class="view-mode">${statusHtml}</span>
    <select class="edit-mode status">
      <option value="待預約" ${row.status === "待預約" ? "selected" : ""}>待預約</option>
      <option value="待施打" ${row.status === "待施打" ? "selected" : ""}>待施打</option>
      <option value="完成" ${row.status === "完成" ? "selected" : ""}>完成</option>
    </select>
  </td>
  <td data-label="接單者">
    <span class="view-mode">${claimedBy}</span>
    <input class="edit-mode claimedBy" value="${claimedBy}">
  </td>
  <td data-label="施打者">
    <span class="view-mode">${operator}</span>
    <input class="edit-mode operator" value="${operator}">
  </td>
  <td data-label="管路資訊">
    <span class="view-mode">${catheterType}<br>${catheterLength} cm</span>
    <div class="edit-mode">
      <input class="catheterType" placeholder="種類" value="${catheterType}"><br>
      <input class="catheterLength" type="number" placeholder="長度" value="${catheterLength}">
    </div>
  </td>
  <td data-label="部位 / 血管">
    <span class="view-mode">${insertionSite}/${vein}</span>
    <div class="edit-mode">
      <input class="insertionSite" placeholder="部位" value="${insertionSite}"><br>
      <input class="vein" placeholder="血管" value="${vein}">
    </div>
  </td>
  <td data-label="困難度">
    <span class="view-mode">${difficulty}</span>
    <select class="edit-mode difficulty">
      <option value="一般" ${row.difficulty === "一般" ? "selected" : ""}>一般</option>
      <option value="困難" ${row.difficulty === "困難" ? "selected" : ""}>困難</option>
    </select>
  </td>
  <td data-label="備註">
    <span class="view-mode">${remark}</span>
    <textarea class="edit-mode remark">${remark}</textarea>
  </td>
  <td data-label="操作">
    <button class="btn btn-edit" onclick="toggleEdit('${taskId}')">編輯</button>
    <button class="btn btn-save" onclick="saveRow('${taskId}')">儲存</button>
    <button class="btn btn-del" onclick="deleteRow('${taskId}')">刪除</button>
  </td>
</tr>`;
  }).join("");
}

function loadTasks(useDateFilter = false) {
  const dateStartEl = document.getElementById("dateStart");
  const dateEndEl = document.getElementById("dateEnd");
  const url = useDateFilter
    ? `${API_LIST}?start=${dateStartEl.value}&end=${dateEndEl.value}`
    : API_LIST;

  console.log("loadTasks url =", url);

  fetch(url)
    .then(res => res.json())
    .then(data => {
      console.log("API 回傳資料 =", data);
      allRows = Array.isArray(data) ? data : [];
      filteredRows = [...allRows];
      currentPage = 1;
      renderTable();
    })
    .catch(err => {
      console.error("loadTasks error =", err);
      allRows = [];
      filteredRows = [];
      currentPage = 1;
      renderTable();
    });
}

function filterKeyword() {
  const kw = document.getElementById("keywordInput").value.toLowerCase();
  filteredRows = allRows.filter(r => JSON.stringify(r).toLowerCase().includes(kw));
  currentPage = 1;
  renderTable();
}

function changePageSize() {
  pageSize = Number(document.getElementById("pageSizeSelect").value);
  currentPage = 1;
  renderTable();
}

function goToPage(page) {
  const totalPages = Math.max(1, Math.ceil(filteredRows.length / pageSize));
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
}

function openCsvModal() {
  document.getElementById("csvDateStart").value = document.getElementById("dateStart").value || "";
  document.getElementById("csvDateEnd").value = document.getElementById("dateEnd").value || "";
  document.getElementById("csvModal").classList.add("show");
}

function closeCsvModal() {
  document.getElementById("csvModal").classList.remove("show");
}

function buildCSVAndDownload(rows) {
  if (!rows.length) {
    alert("目前沒有可下載的案件資料");
    return;
  }

  const headers = [
    "起單時間", "任務編號", "病人姓名", "床號", "病歷號", "Status",
    "接單者", "施打者", "管路種類", "管路長度(cm)", "部位", "血管", "困難度", "備註"
  ];

  const csvRows = rows.map(row => [
    formatDisplayDateTime(row.createdAt),
    row.task_id || "",
    row.patient_name || "",
    row.bed_no || "",
    row.MRN || "",
    row.status || "",
    row.claimedBy || "",
    row.operator || "",
    row.catheterType || "",
    row.catheterLength || "",
    row.insertionSite || "",
    row.vein || "",
    row.difficulty || "",
    row.remark || ""
  ]);

  const csvContent = [headers, ...csvRows]
    .map(row => row.map(escapeCSV).join(","))
    .join("\n");

  const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = formatDateLocal(new Date());

  a.href = url;
  a.download = `PICC案件清單_${today}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function confirmDownloadCSV() {
  const start = document.getElementById("csvDateStart").value;
  const end = document.getElementById("csvDateEnd").value;

  if ((start && !end) || (!start && end)) {
    alert("請同時選擇開始日期與結束日期");
    return;
  }

  if (!start && !end) {
    closeCsvModal();
    buildCSVAndDownload(filteredRows);
    return;
  }

  const url = `${API_LIST}?start=${start}&end=${end}`;
  console.log("download csv url =", url);

  fetch(url)
    .then(res => res.json())
    .then(data => {
      console.log("CSV API 回傳資料 =", data);
      const rows = Array.isArray(data) ? data : [];
      closeCsvModal();
      buildCSVAndDownload(rows);
    })
    .catch(err => {
      console.error("download csv error =", err);
      alert("下載 CSV 失敗");
    });
}

function toggleEdit(id) {
  const tr = document.getElementById(`tr-${id}`);
  if (tr) tr.classList.add("editing");
}

function saveRow(id) {
  const tr = document.getElementById(`tr-${id}`);
  if (!tr) return;

  const payload = {
    task_id: id,
    bed_no: tr.querySelector(".bed_no")?.value || "",
    status: tr.querySelector(".status")?.value || "",
    claimedBy: tr.querySelector(".claimedBy")?.value || "",
    operator: tr.querySelector(".operator")?.value || "",
    catheterType: tr.querySelector(".catheterType")?.value || "",
    catheterLength: tr.querySelector(".catheterLength")?.value || "",
    insertionSite: tr.querySelector(".insertionSite")?.value || "",
    vein: tr.querySelector(".vein")?.value || "",
    difficulty: tr.querySelector(".difficulty")?.value || "",
    remark: tr.querySelector(".remark")?.value || ""
  };

  fetch(API_UPDATE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(res => {
    if (res.ok) {
      alert("儲存成功");
      tr.classList.remove("editing");
      loadTasks(true);
    } else {
      alert("儲存失敗");
    }
  }).catch(err => {
    console.error("saveRow error =", err);
    alert("儲存失敗");
  });
}

function deleteRow(id) {
  if (!confirm("確定要刪除這筆任務嗎？")) return;

  fetch(API_DELETE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ task_id: id })
  }).then(res => {
    if (res.ok) {
      alert("已刪除");
      loadTasks(true);
    } else {
      alert("刪除失敗");
    }
  }).catch(err => {
    console.error("deleteRow error =", err);
    alert("刪除失敗");
  });
}

(function init() {
  const now = new Date();
  const firstDayOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  document.getElementById("dateStart").value = formatDateLocal(firstDayOfMonth);
  document.getElementById("dateEnd").value = formatDateLocal(now);
  runSelfTests();
  window.onload = () => loadTasks(true);
})();
</script>
