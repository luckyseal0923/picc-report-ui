<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICC 後臺管理系統</title>

<style>
:root {
  --primary: #10B981;
  --bg: #f1f5f9;
  --text: #334155;
  --border: #e2e8f0;
}

body {
  font-family: -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
  gap: 10px;
}

.filter-bar {
  background: white;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.table-container {
  width: 100%;
  overflow-x: auto;
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #e2e8f0;
  padding: 14px;
  font-size: 13px;
  text-align: left;
  border-bottom: 2px solid var(--border);
  cursor: pointer;
  white-space: nowrap;
}

td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  vertical-align: middle;
}

/* ===== Status 標籤 ===== */
.status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.status-booking { background:#e0f2fe; color:#0369a1; }
.status-pending { background:#fef3c7; color:#92400e; }
.status-done    { background:#dcfce7; color:#166534; }

/* ===== 編輯模式（必要） ===== */
.view-mode { display: inline; }
.edit-mode { display: none; width: 95%; }

.editing .view-mode { display: none; }
.editing .edit-mode { display: inline; }

/* ===== Button ===== */
.btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.btn-edit { background:#f1f5f9; }
.btn-save { background:#10B981; color:white; display:none; }
.btn-del  { background:#fee2e2; color:#b91c1c; }

.editing .btn-save { display:inline-block; }
.editing .btn-edit { display:none; }

/* ===== RWD ===== */
@media (max-width: 1000px) {
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  tr {
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 15px;
    padding: 10px;
    background: white;
  }
  td {
    display: flex;
    justify-content: space-between;
    padding: 10px 5px;
    border: none;
    border-bottom: 1px dashed #eee;
    text-align: right;
  }
  td::before {
    content: attr(data-label);
    font-weight: bold;
    color: #64748b;
    text-align: left;
  }
  td:last-child { border: none; }
}
</style>
</head>

<body>

<div class="header">
  <h2>📋 PICC 後臺管理系統</h2>
  <div class="filter-bar">
    <input type="date" id="dateStart">
    <span>至</span>
    <input type="date" id="dateEnd">
    <input type="text" id="keywordInput" placeholder="🔍 關鍵字搜尋…" oninput="filterKeyword()">
    <button class="btn" style="background:var(--primary); color:white" onclick="loadTasks()">查詢區間</button>
  </div>
</div>

<div class="table-container">
<table id="taskTable">
<thead>
<tr>
  <th>起單時間 / 任務編號</th>
  <th>病人 / 病歷號</th>
  <th>床號</th>
  <th>Status</th>
  <th>接單者</th>
  <th>施打者</th>
  <th>管路資訊</th>
  <th>部位 / 血管</th>
  <th>困難度</th>
  <th>備註</th>
  <th>操作</th>
</tr>
</thead>
<tbody id="taskBody"></tbody>
</table>
</div>

<script>
const API_LIST   = "https://chihwei-n8n.zeabur.app/webhook/admin/tasks";
const API_UPDATE = "https://chihwei-n8n.zeabur.app/webhook/update-task";
const API_DELETE = "https://chihwei-n8n.zeabur.app/webhook/delete-task";

let allRows = [];

function safe(v) {
  return (v === undefined || v === null || v === "") ? "-" : v;
}

function renderStatus(status) {
  if (!status || status === "-") return "-";
  if (status === "待預約") return `<span class="status status-booking">待預約</span>`;
  if (status === "待施打") return `<span class="status status-pending">待施打</span>`;
  if (status === "完成")   return `<span class="status status-done">完成</span>`;
  return safe(status);
}

/* ===== 日期預設 ===== */
const now = new Date();
const twoMonthsAgo = new Date();
twoMonthsAgo.setMonth(now.getMonth() - 2);
dateStart.value = twoMonthsAgo.toISOString().split('T')[0];
dateEnd.value   = now.toISOString().split('T')[0];

function loadTasks() {
  fetch(`${API_LIST}?start=${dateStart.value}&end=${dateEnd.value}`)
    .then(res => res.json())
    .then(data => {
      allRows = data;
      renderTable(allRows);
    });
}

function renderTable(data) {
  taskBody.innerHTML = data.map(row => `
<tr id="tr-${row.task_id}">
<td>${row.createdAt?.replace('T',' ').substring(0,16) || "-"}<br><b>${row.task_id}</b></td>
<td><b>${safe(row.patient_name)}</b><br>MRN: ${safe(row.MRN)}</td>

<td>
  <span class="view-mode">${safe(row.bed_no)}</span>
  <input class="edit-mode bed_no" value="${safe(row.bed_no)}">
</td>

<td>
  <span class="view-mode">${renderStatus(row.status)}</span>
  <select class="edit-mode status">
    <option value="待預約" ${row.status==="待預約"?"selected":""}>待預約</option>
    <option value="待施打" ${row.status==="待施打"?"selected":""}>待施打</option>
    <option value="完成" ${row.status==="完成"?"selected":""}>完成</option>
  </select>
</td>

<td>
  <span class="view-mode">${safe(row.claimedBy)}</span>
  <input class="edit-mode claimedBy" value="${safe(row.claimedBy)}">
</td>

<td>
  <span class="view-mode">${safe(row.operator)}</span>
  <input class="edit-mode operator" value="${safe(row.operator)}">
</td>

<td>
  <span class="view-mode">${safe(row.catheterType)}<br>${safe(row.catheterLength)} cm</span>
  <div class="edit-mode">
    <input class="catheterType" placeholder="種類" value="${safe(row.catheterType)}"><br>
    <input class="catheterLength" type="number" placeholder="長度" value="${safe(row.catheterLength)}">
  </div>
</td>

<td>
  <span class="view-mode">${safe(row.insertionSite)}/${safe(row.vein)}</span>
  <div class="edit-mode">
    <input class="insertionSite" placeholder="部位" value="${safe(row.insertionSite)}"><br>
    <input class="vein" placeholder="血管" value="${safe(row.vein)}">
  </div>
</td>

<td>
  <span class="view-mode">${safe(row.difficulty)}</span>
  <select class="edit-mode difficulty">
    <option value="一般" ${row.difficulty==="一般"?"selected":""}>一般</option>
    <option value="困難" ${row.difficulty==="困難"?"selected":""}>困難</option>
  </select>
</td>

<td>
  <span class="view-mode">${safe(row.remark)}</span>
  <textarea class="edit-mode remark">${safe(row.remark)}</textarea>
</td>

<td>
  <button class="btn btn-edit" onclick="toggleEdit('${row.task_id}')">編輯</button>
  <button class="btn btn-save" onclick="saveRow('${row.task_id}')">儲存</button>
  <button class="btn btn-del" onclick="deleteRow('${row.task_id}')">刪除</button>
</td>
</tr>
`).join("");
}

/* ===== 關鍵字搜尋 ===== */
function filterKeyword() {
  const kw = keywordInput.value.toLowerCase();
  renderTable(allRows.filter(r => JSON.stringify(r).toLowerCase().includes(kw)));
}

/* ===== 編輯 / 儲存（關鍵修正） ===== */
function toggleEdit(id) {
  document.getElementById(`tr-${id}`).classList.add("editing");
}

function saveRow(id) {
  const tr = document.getElementById(`tr-${id}`);
  const payload = {
    task_id: id,
    bed_no: tr.querySelector(".bed_no").value,
    status: tr.querySelector(".status").value,
    claimedBy: tr.querySelector(".claimedBy").value,
    operator: tr.querySelector(".operator").value,
    catheterType: tr.querySelector(".catheterType").value,
    catheterLength: tr.querySelector(".catheterLength").value,
    insertionSite: tr.querySelector(".insertionSite").value,
    vein: tr.querySelector(".vein").value,
    difficulty: tr.querySelector(".difficulty").value,
    remark: tr.querySelector(".remark").value
  };

  fetch(API_UPDATE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(res => {
    if (res.ok) {
      alert("儲存成功");
      tr.classList.remove("editing");
      loadTasks();
    } else {
      alert("儲存失敗");
    }
  });
}

function deleteRow(id) {
  if (!confirm("確定要刪除這筆任務嗎？")) return;
  fetch(API_DELETE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ task_id: id })
  }).then(res => {
    if (res.ok) {
      document.getElementById(`tr-${id}`)?.remove();
      alert("已刪除");
    } else {
      alert("刪除失敗");
    }
  });
}

window.onload = loadTasks;
</script>

</body>
</html>
