<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICC 後臺管理系統 - 最終演示版</title>

<style>
  :root {
    --primary: #10B981;
    --bg: #f1f5f9;
    --text: #334155;
    --border: #e2e8f0;
    --header: #e2e8f0;
  }

  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    margin: 0;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
    gap: 10px;
  }

  .filter-bar {
    background: white;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  /* ✅ 不超出畫面 */
  .table-container {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
  }

  th {
    background: var(--header);
    padding: 14px;
    font-size: 13px;
    text-align: left;
    color: #1e293b;
    border-bottom: 2px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
  }

  td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: middle;
  }

  .view-mode { display: inline-block; }
  .edit-mode { display: none; width: 95%; padding: 6px; border: 1px solid var(--primary); border-radius: 4px; }

  .editing .view-mode { display: none; }
  .editing .edit-mode { display: block; }

  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }

  .btn-edit { background: #f1f5f9; color: #475569; }
  .btn-save { background: var(--primary); color: white; display: none; }
  .btn-del { background: #fee2e2; color: #b91c1c; }

  .editing .btn-save { display: inline-block; }
  .editing .btn-edit { display: none; }

  @media (max-width: 1000px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr {
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 15px;
      padding: 10px;
      background: white;
    }
    td {
      display: flex;
      justify-content: space-between;
      padding: 10px 5px;
      border: none;
      border-bottom: 1px dashed #eee;
      text-align: right;
    }
    td::before {
      content: attr(data-label);
      font-weight: bold;
      color: #64748b;
      text-align: left;
    }
    td:last-child { border: none; }
  }
</style>
</head>

<body>

<div class="header">
  <h2>📋 PICC 後臺管理系統</h2>
  <div class="filter-bar">
    <input type="date" id="dateStart">
    <span>至</span>
    <input type="date" id="dateEnd">
    <button class="btn" style="background:var(--primary); color:white" onclick="loadTasks()">查詢區間</button>
  </div>
</div>

<div class="table-container">
<table id="taskTable">
<thead>
<tr>
  <th onclick="sortTable(0)">起單時間 / 任務編號 ↕</th>
  <th onclick="sortTable(1)">病人 / 病歷號 ↕</th>
  <th onclick="sortTable(2)">床號 ↕</th>
  <th onclick="sortTable(3)">接單者 ↕</th>
  <th onclick="sortTable(4)">施打者 ↕</th>
  <th onclick="sortTable(5)">管路資訊 ↕</th>
  <th onclick="sortTable(6)">部位 / 血管 ↕</th>
  <th onclick="sortTable(7)">困難度 ↕</th>
  <th onclick="sortTable(8)">Status ↕</th>
  <th onclick="sortTable(9)">備註 ↕</th>
  <th>操作</th>
</tr>
</thead>
<tbody id="taskBody"></tbody>
</table>
</div>

<script>
const API_LIST   = "https://chihwei-n8n.zeabur.app/webhook/admin/tasks";
const API_UPDATE = "https://chihwei-n8n.zeabur.app/webhook/update-task";
const API_DELETE = "https://chihwei-n8n.zeabur.app/webhook/delete-task";

/* ✅ 統一 undefined 顯示為 "-" */
function safe(v) {
  return (v === undefined || v === null || v === "") ? "-" : v;
}

const now = new Date();
const twoMonthsAgo = new Date();
twoMonthsAgo.setMonth(now.getMonth() - 2);
dateStart.value = twoMonthsAgo.toISOString().split('T')[0];
dateEnd.value   = now.toISOString().split('T')[0];

function loadTasks() {
  fetch(`${API_LIST}?start=${dateStart.value}&end=${dateEnd.value}`)
    .then(res => res.json())
    .then(renderTable);
}

function renderTable(data) {
  taskBody.innerHTML = data.map(row => {
    const timeStr = row.createdAt ? row.createdAt.replace('T',' ').substring(0,16) : "-";
    return `
<tr id="tr-${row.task_id}">
<td data-label="起單/編號">${timeStr}<br><b>${row.task_id}</b></td>
<td data-label="病人/病歷號"><b>${safe(row.patient_name)}</b><br>MRN: ${safe(row.MRN)}</td>
<td data-label="床號">${safe(row.bed_no)}</td>
<td data-label="接單者">${safe(row.claimedBy)}</td>
<td data-label="施打者">${safe(row.operator)}</td>
<td data-label="管路資訊">
  ${safe(row.catheterType)}<br>
  ${safe(row.catheterLength)} cm
</td>
<td data-label="部位/血管">${safe(row.insertionSite)}/${safe(row.vein)}</td>
<td data-label="困難度">${safe(row.difficulty)}</td>
<td data-label="Status">${safe(row.status)}</td>
<td data-label="備註">${safe(row.remark)}</td>
<td>
  <button class="btn btn-edit" onclick="toggleEdit('${row.task_id}')">編輯</button>
  <button class="btn btn-del" onclick="deleteRow('${row.task_id}')">刪除</button>
</td>
</tr>`;
  }).join("");
}

function sortTable(n) {
  const table = document.getElementById("taskTable");
  let switching = true, dir = "asc";
  while (switching) {
    switching = false;
    const rows = table.rows;
    for (let i = 1; i < rows.length - 1; i++) {
      const x = rows[i].cells[n].innerText.toLowerCase();
      const y = rows[i + 1].cells[n].innerText.toLowerCase();
      if ((dir === "asc" && x > y) || (dir === "desc" && x < y)) {
        rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
        switching = true;
        break;
      }
    }
    if (!switching && dir === "asc") { dir = "desc"; switching = true; }
  }
}

window.onload = loadTasks;
</script>

</body>
</html>
